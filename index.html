<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home | Ginna's Portfolio</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <nav>
            <a href="index.html" aria-current="page">Home</a>
            <a href="about.html">About me</a>
            <a href="work.html">My Work</a>
            <a href="favorites.html">Favorites</a>
            <a href="contact.html">Contact</a>
        </nav>

        <main>

            <!-- Side Section dec -->
             <div class="side-section">
                <img src="images/assets/computer.png" alt="Computer">
                <img src="images/assets/safari.png" alt="Safari">
                <img class="chrome-icon" src="images/assets/chrome.png" alt="Chrome">
                <img class="folder-icon" src="images/assets/folder.png" alt="Folder">
                <img src="images/assets/trash.png" alt="Trash">
             </div>

            
            <div class="top-content">

                <div class="drawing-box">
                    <img class="drawing-image" src="images/assets/edit.png" alt="drawing for the user">

                    <canvas id="drawingCanvas" aria-label="Interactive drawing canvas"></canvas>

                    <div class="canvas-controls">
                        <p class="canvas-hint"> Click and drag to draw</p>

                        <button id="clearButton" class="clear-button" type="button">
                            Clear drawing
                        </button>
                    </div>
                </div>

                <!-- WELCOME SECTION -->

                <div class="welcome">
                    <h1>Welcome!</h1>
        
                    <p>
                        This is my little corner of the internet where you can get to know me, 
                        see what I've been creating, and learn a little about the things I love. 
                        Have fun looking around!
                    </p>
                </div>

                <div class="reminders">
                    <img src="images/assets/notes.png" alt="cute reminder notepad">

                    <div class="reminder-content">
                        <p id="reminderText" aria-live="polite">
                            Click for a reminder
                        </p>

                        <button id="reminderButton" type="button">
                            New reminder
                        </button>

                    </div>
                </div>
            </div>
        </main>

        <script src="script.js"></script>
    </body>

</html>
