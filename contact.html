<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact | Ginna's Portfolio</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <nav>
            <a href="index.html" aria-current="page">Home</a>
            <a href="about.html" aria-current="page">About me</a>
            <a href="work.html" aria-current="page">My Work</a>
            <a href="favorites.html" aria-current="page">Favorites</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>

        <main>

            <!-- SIDE SECTION-->
             <div class="side-section">
                <img src="images/assets/computer.png" alt="Computer">
                <img src="images/assets/safari.png" alt="Safari">
                <img class="chrome-icon" src="images/assets/chrome.png" alt="Chrome">
                <img class="folder-icon" src="images/assets/folder.png" alt="Folder">
                <img src="images/assets/trash.png" alt="Trash">
             </div>
             
             <div class="contact-layout">
               <!--Contact Form-->
                <section class="contact-card">
                    <h1>Contact Me</h1>

                    <form>
                        <label for="fname">Name:</label>
                        <input type="text" id="fname" name="fname" required>

                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>

                        <label for="message">Message:</label>
                        <textarea id="message" name="message"></textarea>

                        
                        <button type="submit">Submit</button>
                    </form>
                </section>

                <!--Right side Page-->
                <aside class="contact-side">

                    <!-- INTERACTIVE CALENDAR -->
                    <div class="calendar-content">

                        <div class="calendar-header">
                            <button id="previousMonth" type="button" aria-label="Previous month"> ◀</button>

                            <h2 id="calendarTitle"></h2>

                            <button id="nextMonth" type="button" aria-label="Next month"> ▶</button>
                        </div>

                        <div id="calendarGrid" class="calendar-grid">
                            <div class="day-name">Su</div>
                            <div class="day-name">Mo</div>
                            <div class="day-name">Tu</div>
                            <div class="day-name">We</div>
                            <div class="day-name">Th</div>
                            <div class="day-name">Fr</div>
                            <div class="day-name">Sa</div>
                        </div>

                    </div>


                    <!-- CAT DECORATION -->
                    <img class="contact-cat" src="images/assets/killua-tech-collage.png" alt="Killua using a laptop">

                </aside>

            </div>


        </main>
         <script src="script.js"></script>
    </body>
</html>
